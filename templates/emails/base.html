<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background:#F8FAFC;font-family:Inter,Segoe UI,Arial,sans-serif;color:#0A0B0D;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F8FAFC;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border:1px solid #E2E6EB;border-radius:14px;overflow:hidden;">
          <tr>
            <td style="background:#0A0B0D;padding:20px 28px;">
              <span style="font-family:'Space Grotesk',Segoe UI,Arial,sans-serif;font-size:16px;font-weight:600;color:#F8FAFC;">Velatrix One</span>
              <span style="font-family:'Space Grotesk',Segoe UI,Arial,sans-serif;font-size:16px;font-weight:600;color:#60A5FA;">&nbsp;·&nbsp;Projects</span>
            </td>
          </tr>
          <tr>
            <td style="padding:32px 28px 8px;font-size:15px;line-height:1.6;color:#0A0B0D;">
              {% block content %}{% endblock %}
            </td>
          </tr>
          <tr>
            <td style="padding:16px 28px 28px;font-size:12px;line-height:1.5;color:#4B5563;border-top:1px solid #E2E6EB;">
              {% block footer_note %}{% endblock %}
              <p style="margin:8px 0 0;">Velatrix One · Projects — Gestión de proyectos y equipos · por Velatrix</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
