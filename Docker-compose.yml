# Backend + PostgreSQL para desarrollo/pruebas locales.
#   docker compose -f Docker-compose.yml up --build
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: velatrix
      POSTGRES_USER: velatrix
      POSTGRES_PASSWORD: velatrix
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U velatrix"]
      interval: 5s
      retries: 10

  web:
    build: .
    ports:
      - "8000:8000"
    environment:
      DEBUG: "True"
      SECRET_KEY: dev-docker-key
      ALLOWED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgres://velatrix:velatrix@db:5432/velatrix
      DATABASE_SSL: "False"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
      FRONTEND_URL: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
